<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="THE LOOP" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="description" content="THE LOOP — Agenda, guide VIP et networking d'affaires à Conakry, Guinée." />
    <title>THE LOOP</title>
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #000;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #pwa-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #pwa-splash .ring {
        width: 72px;
        height: 72px;
        border: 3px solid #000;
        border-radius: 50%;
        position: relative;
      }
      #pwa-splash .ring::before {
        content: '';
        position: absolute;
        inset: 14px;
        border: 3px solid #000;
        border-right-color: transparent;
        border-bottom-color: transparent;
        border-radius: 50%;
        transform: rotate(-40deg);
      }
      #pwa-splash .ring::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 8px;
        width: 8px;
        height: 8px;
        margin-top: -4px;
        background: #000;
        border-radius: 50%;
      }
      #pwa-splash p {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #c9a84c;
      }
    </style>
  </head>
  <body>
    <div id="pwa-splash" aria-hidden="true">
      <div class="ring" aria-hidden="true"></div>
      <p>THE LOOP</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
