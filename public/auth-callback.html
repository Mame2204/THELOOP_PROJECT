<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>THE LOOP — Confirmation e-mail</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4fcfd;
      --text: #0a0a0a;
      --muted: #636e72;
      --gold: #c9a84c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
    main { max-width: 420px; }
    .kicker {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 { margin: 12px 0 0; font-size: 1.35rem; line-height: 1.3; }
    p { margin: 16px 0 0; font-size: 0.95rem; line-height: 1.55; color: var(--muted); }
    .hint { margin-top: 20px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">THE LOOP</p>
    <h1 id="title">Confirmation en cours…</h1>
    <p id="message">Validation de votre e-mail…</p>
    <p class="hint" id="hint"></p>
  </main>
  <script>
    (function () {
      var AUTH_CALLBACK_BASE = 'https://api.theloop-app.com/auth/callback';
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var hint = document.getElementById('hint');

      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var paramString = hash.indexOf('#') === 0
        ? hash.slice(1)
        : (search.indexOf('?') === 0 ? search.slice(1) : '');

      if (!paramString) {
        title.textContent = 'Lien incomplet';
        message.textContent = 'Ce lien ne contient pas les informations attendues. Rouvrez le message reçu par e-mail ou demandez un nouvel envoi depuis l\'application.';
        return;
      }

      var params = new URLSearchParams(paramString);
      var error = params.get('error_description') || params.get('error');
      if (error) {
        title.textContent = 'Confirmation impossible';
        message.textContent = decodeURIComponent(String(error).replace(/\+/g, ' '));
        hint.textContent = 'THE LOOP → Connexion → renvoyez l\'e-mail de confirmation.';
        return;
      }

      title.textContent = 'Un instant…';
      message.textContent = 'Ouverture de la page sécurisée pour finaliser votre compte.';
      hint.textContent = 'Aucune application à installer pour cette étape — choisissez votre mot de passe dans le navigateur.';

      window.location.replace(AUTH_CALLBACK_BASE + '?' + paramString);
    })();
  </script>
</body>
</html>
