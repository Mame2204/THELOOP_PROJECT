<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — stories « Sur le terrain » 7/12 → 16/12</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide {
      width: 1080px; height: 1920px; margin: 0 auto 16px; position: relative; overflow: hidden;
      background: linear-gradient(165deg, #1a2830 0%, #0a3a44 45%, #062830 100%); color: #fff;
    }
    .grain { position: absolute; inset: 0; opacity: 0.08; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    .ribbon {
      position: absolute; top: 0; left: 0; right: 0; padding: 22px;
      background: linear-gradient(90deg, #0f7a8e, #0a3a44);
      text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
    }
    .badge { position: absolute; top: 88px; right: 56px; font-size: 18px; font-weight: 800; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 2px solid rgba(230,185,58,0.45); }
    .inner { height: 100%; padding: 300px 56px 360px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .panel { max-width: 920px; width: 100%; padding: 56px 40px; border-radius: 32px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.12); }
    .line { font-size: 72px; font-weight: 800; line-height: 1.12; margin: 0; }
    .line.long { font-size: 56px; }
    .gold { color: #e6b93a; }
    .foot { margin-top: 40px; font-size: 28px; font-weight: 700; line-height: 1.35; color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>
  <div id="slides"></div>
  <script>
    /* Aucune date d'ouverture avant le 17/12 : ni « 17 décembre », ni « 24 décembre », ni compte à rebours J-x. */
    const days = [
      { label: '7 décembre', lines: ['Conakry.', 'On prépare le guide.', 'Sélection en cours.'] },
      { label: '8 décembre', lines: ['Rencontres.', 'Écouter.', 'Comprendre ce qui vaut le coup.'] },
      { label: '9 décembre', lines: ['Critères.', 'Calme possible.', 'Service.', 'Expérience soignée.'] },
      { label: '10 décembre', lines: ['Agenda.', 'Ce qui compte', 'sans le bruit.'] },
      { label: '11 décembre', lines: ['Outils.', 'Le quotidien', 'centralisé.'] },
      { label: '12 décembre', lines: ['Parcours.', 'Organiser', 'son temps.'] },
      { label: '13 décembre', lines: ['Accès anticipé.', 'Premiers inscrits,', 'premiers invités.'] },
      { label: '14 décembre', lines: ['Partenaires.', 'Des adresses', 'rejoignent The Loop.'] },
      { label: '15 décembre', lines: ['Derniers réglages.', 'Tests finaux.', 'Les invitations arrivent bientôt.'] },
      { label: '16 décembre', lines: ['Ça se précise.', 'Inscrit tôt ?', 'Surveille ta boîte mail.'] },
    ];
    const root = document.getElementById('slides');
    for (const day of days) {
      day.lines.forEach((line, i) => {
        const isLast = i === day.lines.length - 1;
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `${day.label} · ${i + 1}/${day.lines.length}`;
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.innerHTML = `<div class="grain"></div>
          <div class="ribbon">Sur le terrain · ${day.label}</div>
          <div class="badge">${i + 1} / ${day.lines.length}</div>
          <div class="inner"><div class="panel">
            <p class="line${line.length > 24 ? ' long' : ''}">${line.replace(/(premiers invités\.|boîte mail\.|bientôt\.)/g, '<span class="gold">$1</span>')}</p>
            ${isLast ? '<p class="foot">Réserve ta place · <span class="gold">theloop-app.com</span></p>' : ''}
          </div></div>`;
        root.append(label, slide);
      });
    }
  </script>
</body>
</html>
