<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 19/11 · Merci</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; --muted: #3d5560; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide {
      width: 1080px; height: 1350px; margin: 0 auto 16px; position: relative; overflow: hidden;
      background: linear-gradient(175deg, #ecf4f7 0%, #d4e8ef 45%, #b8d9e4 100%); color: var(--deep);
    }
    .atmo { position: absolute; inset: -20%; background: url('assets/capture-accueil-2.jpg') center 20% / cover no-repeat; filter: blur(44px) saturate(0.85); opacity: 0.22; }
    .atmo-teal {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(236,244,247,0.88) 100%);
      z-index: 1;
    }
    .inner {
      position: relative; z-index: 2; height: 100%; padding: 88px 64px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box;
    }
    .panel {
      background: #fff; border-radius: 36px; padding: 72px 56px; width: 100%; max-width: 920px;
      box-shadow: 0 24px 64px rgba(10,58,68,0.12); border: 2px solid rgba(15,122,142,0.1); box-sizing: border-box;
    }
    .mark-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 36px; }
    .mark-row span { font-size: 22px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; }
    .merci { font-size: 112px; font-weight: 800; line-height: 1; margin: 0; color: var(--deep); }
    .rule { width: 88px; height: 5px; background: var(--gold); border-radius: 3px; margin: 36px auto; }
    .h { font-size: 52px; font-weight: 800; line-height: 1.2; margin: 0; }
    .p { font-size: 36px; line-height: 1.45; font-weight: 600; color: var(--muted); margin-top: 28px; }
    .gold { color: #9a7720; font-weight: 800; }
    .pill {
      display: inline-block; margin-top: 36px; padding: 18px 36px; border-radius: 999px;
      background: var(--deep); color: #fff; font-size: 28px; font-weight: 800;
    }
    .ribbon {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      background: linear-gradient(90deg, var(--deep) 0%, var(--teal) 100%);
      color: #fff; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; padding: 22px;
    }
  </style>
</head>
<body>

  <div class="label">19/11 · Feed · Merci + rappel</div>
  <div class="slide">
    <div class="atmo"></div><div class="atmo-teal"></div>
    <div class="ribbon">Acte B · liste ouverte</div>
    <div class="inner" style="padding-top:120px">
      <div class="panel">
        <div class="mark-row">
          <svg width="44" height="44" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="15" stroke="#0A3A44" stroke-width="3"/><path d="M 13.5 10.21 A 9 9 0 1 1 13.5 25.79" stroke="#0A3A44" stroke-width="3" stroke-linecap="round"/><circle cx="10" cy="18" r="3.5" fill="#0A3A44"/></svg>
          <span>The Loop</span>
        </div>
        <h1 class="merci">Merci.</h1>
        <div class="rule"></div>
        <h2 class="h">La liste est ouverte.</h2>
        <p class="p"><span class="gold">100 premières places</span> · accès anticipé · 17 décembre</p>
        <span class="pill">Réserve ta place</span>
      </div>
    </div>
  </div>

</body>
</html>
