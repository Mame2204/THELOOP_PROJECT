<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 12/11 · J-5</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --deep: #0a3a44;
      --teal: #0f7a8e;
      --teal-bg: #0f7a8e;
      --gold: #e6b93a;
    }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide {
      width: 1080px;
      height: 1350px;
      margin: 0 auto 16px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(165deg, #0f7a8e 0%, #0a3a44 55%, #062830 100%);
      color: #fff;
    }
    .glow {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% 35%, rgba(230,185,58,0.18), transparent 60%);
      pointer-events: none;
    }
    .inner {
      position: relative; z-index: 2; height: 100%;
      padding: 88px 64px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; box-sizing: border-box;
    }
    .ey { font-size: 26px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 16px; }
    .j5 {
      font-size: 220px; font-weight: 800; line-height: 0.95; margin: 0;
      color: var(--gold);
      text-shadow: 0 8px 40px rgba(0,0,0,0.25);
      letter-spacing: -0.02em;
    }
    .j5 span { font-size: 120px; vertical-align: super; letter-spacing: 0.08em; }
    .rule { width: 100px; height: 5px; background: var(--gold); border-radius: 3px; margin: 40px auto; }
    .h { font-size: 48px; font-weight: 800; line-height: 1.25; margin: 0; max-width: 900px; }
    .p { font-size: 36px; line-height: 1.4; font-weight: 600; margin-top: 32px; color: rgba(255,255,255,0.88); max-width: 880px; }
    .mark-row { display: flex; align-items: center; gap: 14px; margin-bottom: 48px; }
    .mark-row span { font-size: 22px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; }
    .pill {
      margin-top: 48px; padding: 20px 40px; border-radius: 999px;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(230,185,58,0.55);
      font-size: 28px; font-weight: 800; letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <div class="label">12/11 · Feed · J-5</div>
  <div class="slide">
    <div class="glow"></div>
    <div class="inner">
      <div class="mark-row">
        <svg width="48" height="48" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="15" stroke="#fff" stroke-width="3"/><path d="M 13.5 10.21 A 9 9 0 1 1 13.5 25.79" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        <span>The Loop</span>
      </div>
      <p class="ey">Compte à rebours</p>
      <h1 class="j5">J<span>-</span>5</h1>
      <div class="rule"></div>
      <h2 class="h">Ouverture de la liste</h2>
      <p class="p"><span style="color:var(--gold)">100 premières places</span><br />Accès anticipé · invitation 17 décembre</p>
      <span class="pill">17 novembre · pas de lien avant</span>
    </div>
  </div>

</body>
</html>
