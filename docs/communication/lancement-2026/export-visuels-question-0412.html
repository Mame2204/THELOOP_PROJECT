<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 4/12 · Question du vendredi</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide {
      width: 1080px; height: 1350px; margin: 0 auto 16px; position: relative; overflow: hidden;
      background: linear-gradient(165deg, #0f7a8e 0%, #0a3a44 55%, #062830 100%); color: #fff;
    }
    .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 42%, rgba(230,185,58,0.2), transparent 62%); }
    .inner { position: relative; z-index: 2; height: 100%; padding: 88px 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
    .mark-row { display: flex; align-items: center; gap: 14px; margin-bottom: 64px; }
    .mark-row span { font-size: 22px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; }
    .ey { font-size: 24px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255,255,255,0.8); margin: 0 0 32px; }
    .q { font-size: 84px; font-weight: 800; line-height: 1.1; margin: 0; max-width: 900px; }
    .gold { color: var(--gold); }
    .rule { width: 100px; height: 5px; background: var(--gold); border-radius: 3px; margin: 52px auto 44px; }
    .p { font-size: 36px; font-weight: 600; line-height: 1.4; color: rgba(255,255,255,0.9); margin: 0; }
    .pill {
      margin-top: 56px; padding: 20px 40px; border-radius: 999px;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(230,185,58,0.55);
      font-size: 28px; font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="label">4/12 · question du vendredi · commentaires</div>
  <div class="slide">
    <div class="glow"></div>
    <div class="inner">
      <div class="mark-row">
        <svg width="48" height="48" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="15" stroke="#fff" stroke-width="3"/><path d="M 13.5 10.21 A 9 9 0 1 1 13.5 25.79" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="10" cy="18" r="3.5" fill="#fff"/></svg>
        <span>The Loop</span>
      </div>
      <p class="ey">Question du vendredi</p>
      <h1 class="q">Ta sortie idéale<br />à Conakry,<br />en <span class="gold">trois mots</span> ?</h1>
      <div class="rule"></div>
      <p class="p">Réponds en commentaire.<br />On lit tout.</p>
      <span class="pill">Guide sélectif · Conakry</span>
    </div>
  </div>
</body>
</html>
