<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 30/11 · story signature</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; --muted: #3d5560; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide { width: 1080px; height: 1920px; margin: 0 auto 16px; position: relative; overflow: hidden; }
    .slide.dark { background: linear-gradient(165deg, #0f7a8e 0%, #0a3a44 55%, #062830 100%); color: #fff; }
    .slide.light { background: linear-gradient(175deg, #ecf4f7 0%, #c8e3ec 45%, #96c4d4 100%); color: var(--deep); }
    .inner { position: relative; z-index: 2; height: 100%; padding: 160px 64px 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
    .panel { background: rgba(255,255,255,0.1); border-radius: 36px; padding: 64px 48px; max-width: 920px; border: 2px solid rgba(255,255,255,0.15); box-sizing: border-box; }
    .slide.light .panel { background: #fff; border-color: rgba(15,122,142,0.12); box-shadow: 0 24px 64px rgba(10,58,68,0.12); }
    .quote { font-size: 44px; font-weight: 700; line-height: 1.35; margin: 0; font-style: italic; }
    .slide.light .quote { font-style: normal; font-weight: 800; font-size: 40px; color: var(--deep); }
    .gold { color: var(--gold); }
    .slide.light .gold { color: #9a7720; }
    .mark { margin-top: 40px; font-size: 22px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.85; }
    .cta { font-size: 52px; font-weight: 800; margin: 0; }
    .sub { font-size: 32px; font-weight: 600; margin-top: 24px; opacity: 0.9; }
    .sticker { margin-top: 36px; padding: 18px 32px; border: 3px dashed rgba(230,185,58,0.65); border-radius: 999px; font-size: 24px; font-weight: 800; color: var(--gold); }
  </style>
</head>
<body>
  <div class="label">30/11 · 1/2 · citation</div>
  <div class="slide dark">
    <div class="inner">
      <div class="panel">
        <p class="quote">Les bonnes adresses ne s'annoncent pas.<br /><span class="gold">Elles se transmettent.</span></p>
        <p class="mark">The Loop</p>
      </div>
    </div>
  </div>
  <div class="label">30/11 · 2/2 · lien discret</div>
  <div class="slide light">
    <div class="inner">
      <div class="panel">
        <p class="cta">Liste ouverte</p>
        <p class="sub"><span class="gold">Premiers inscrits,</span> premiers invités</p>
        <p class="cta" style="font-size:38px;margin-top:32px">theloop-app.com</p>
        <p class="p" style="margin-top:32px;font-size:32px">Réserve ta place</p>
      </div>
    </div>
  </div>
</body>
</html>
