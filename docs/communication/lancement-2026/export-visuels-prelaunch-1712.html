<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 17/12 · pré-launch</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide {
      width: 1080px; height: 1350px; margin: 0 auto 16px; position: relative; overflow: hidden;
      background: linear-gradient(165deg, #0f7a8e 0%, #0a3a44 50%, #062830 100%); color: #fff;
    }
    .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 35%, rgba(230,185,58,0.22), transparent 60%); }
    .inner { position: relative; z-index: 2; height: 100%; padding: 88px 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
    .ey { font-size: 26px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase; opacity: 0.9; margin-bottom: 24px; }
    .h { font-size: 64px; font-weight: 800; line-height: 1.12; margin: 0; }
    .rule { width: 96px; height: 5px; background: var(--gold); border-radius: 3px; margin: 36px auto; }
    .p { font-size: 36px; font-weight: 600; line-height: 1.4; max-width: 880px; color: rgba(255,255,255,0.9); margin: 0; }
    .pill { margin-top: 40px; padding: 18px 32px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 2px solid rgba(230,185,58,0.5); font-size: 26px; font-weight: 800; }
    .gold { color: var(--gold); }
  </style>
</head>
<body>
  <div class="label">17/12 · feed léger · pas de CTA inscription</div>
  <div class="slide">
    <div class="glow"></div>
    <div class="inner">
      <p class="ey">Pré-lancement</p>
      <h1 class="h"><span class="gold">Accès anticipé</span></h1>
      <div class="rule"></div>
      <p class="p">Les <strong>100 premières</strong> invitations partent.</p>
      <span class="pill">Vérifie ta boîte mail</span>
    </div>
  </div>
</body>
</html>
