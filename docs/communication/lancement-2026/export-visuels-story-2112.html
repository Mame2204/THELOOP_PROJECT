<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 21/12 · J-3</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide { width: 1080px; height: 1920px; margin: 0 auto 16px; position: relative; overflow: hidden; color: #fff; }
    .slide.a { background: linear-gradient(165deg, #1a2838 0%, #0a3a44 55%, #062830 100%); }
    .slide.b { background: linear-gradient(175deg, #2a1f10 0%, #0a3a44 45%, #062830 100%); }
    .ribbon { position: absolute; top: 0; left: 0; right: 0; padding: 24px; text-align: center; font-size: 22px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; background: linear-gradient(90deg, var(--deep), var(--teal)); }
    .inner { height: 100%; padding: 140px 64px 240px; display: flex; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
    .panel { max-width: 920px; padding: 64px 48px; border-radius: 36px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.15); }
    .j3 { font-size: 180px; font-weight: 800; line-height: 0.95; margin: 0; color: var(--gold); }
    .j3 span { font-size: 96px; vertical-align: super; }
    .h { font-size: 52px; font-weight: 800; line-height: 1.15; margin: 0; }
    .p { font-size: 34px; font-weight: 600; margin-top: 28px; opacity: 0.92; line-height: 1.4; }
    .gold { color: var(--gold); }
  </style>
</head>
<body>
  <div class="label">21/12 · 1/2</div>
  <div class="slide a">
    <div class="ribbon">J-3</div>
    <div class="inner">
      <div class="panel">
        <h1 class="j3">J<span>-</span>3</h1>
        <p class="p"><span class="gold">24 décembre</span> · The Loop</p>
      </div>
    </div>
  </div>
  <div class="label">21/12 · 2/2</div>
  <div class="slide b">
    <div class="ribbon">Noël · Conakry</div>
    <div class="inner">
      <div class="panel">
        <h2 class="h">Cadeau de <span class="gold">Noël</span></h2>
        <p class="p">Ouverture publique · un repère pour la ville</p>
      </div>
    </div>
  </div>
</body>
</html>
