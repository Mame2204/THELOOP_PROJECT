<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 25/11 · Une règle 1/3</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; --muted: #3d5560; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide {
      width: 1080px; height: 1350px; margin: 0 auto 16px; position: relative; overflow: hidden;
      background: linear-gradient(175deg, #ecf4f7 0%, #c8e3ec 42%, #96c4d4 100%); color: var(--deep);
    }
    .atmo { position: absolute; inset: -20%; background: url('assets/capture-accueil-2.jpg') center 20% / cover no-repeat; filter: blur(42px) saturate(0.85); opacity: 0.24; }
    .atmo-teal { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.62) 0%, rgba(236,244,247,0.85) 100%); z-index: 1; }
    .ribbon {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      background: linear-gradient(90deg, var(--deep) 0%, var(--teal) 100%);
      color: #fff; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; padding: 22px;
    }
    .badge { position: absolute; top: 96px; right: 64px; z-index: 4; font-size: 18px; font-weight: 800; letter-spacing: 0.18em; background: #fff; color: var(--teal); padding: 12px 20px; border-radius: 999px; border: 2px solid rgba(230,185,58,0.5); }
    .inner {
      position: relative; z-index: 2; height: 100%; padding: 120px 64px 88px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box;
    }
    .panel {
      background: #fff; border-radius: 36px; padding: 64px 52px; width: 100%; max-width: 920px;
      box-shadow: 0 22px 60px rgba(10,58,68,0.13); border: 2px solid rgba(15,122,142,0.12); box-sizing: border-box;
    }
    .mark-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 32px; }
    .mark-row span { font-size: 20px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
    .serie { font-size: 22px; font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase; color: var(--teal); margin-bottom: 20px; }
    .titre { font-size: 88px; font-weight: 800; line-height: 1.05; margin: 0; }
    .rule { width: 88px; height: 5px; background: var(--gold); border-radius: 3px; margin: 36px auto; }
    .regle { font-size: 56px; font-weight: 800; line-height: 1.15; margin: 0; color: var(--deep); }
    .gold { color: #9a7720; font-weight: 800; }
    .foot { margin-top: 36px; font-size: 28px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
  </style>
</head>
<body>

  <div class="label">25/11 · Feed · Une règle 1/3</div>
  <div class="slide">
    <div class="atmo"></div><div class="atmo-teal"></div>
    <div class="ribbon">Sélection · série courte</div>
    <div class="badge">1 / 3</div>
    <div class="inner">
      <div class="panel">
        <div class="mark-row">
          <svg width="40" height="40" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="15" stroke="#0A3A44" stroke-width="3"/><path d="M 13.5 10.21 A 9 9 0 1 1 13.5 25.79" stroke="#0A3A44" stroke-width="3" stroke-linecap="round"/></svg>
          <span>The Loop</span>
        </div>
        <p class="serie">Une règle</p>
        <h1 class="titre">Pas la<br />bousculade.</h1>
        <div class="rule"></div>
        <p class="regle">On retient ce qui laisse<br /><span class="gold">respirer</span>.</p>
        <p class="foot">Liste ouverte · lien en légende</p>
      </div>
    </div>
  </div>

</body>
</html>
