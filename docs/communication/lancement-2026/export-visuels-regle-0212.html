<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 2/12 · Une règle 2/3</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; --muted: #3d5560; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide { width: 1080px; height: 1350px; margin: 0 auto 16px; position: relative; overflow: hidden; background: linear-gradient(175deg, #ecf4f7 0%, #c8e3ec 42%, #96c4d4 100%); color: var(--deep); }
    .atmo { position: absolute; inset: -20%; background: url('assets/capture-accueil-2.jpg') center 20% / cover no-repeat; filter: blur(42px); opacity: 0.22; }
    .atmo-teal { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(236,244,247,0.88) 100%); z-index: 1; }
    .ribbon { position: absolute; top: 0; left: 0; right: 0; z-index: 5; background: linear-gradient(90deg, var(--deep) 0%, var(--teal) 100%); color: #fff; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; padding: 22px; }
    .badge { position: absolute; top: 96px; right: 64px; z-index: 4; font-size: 18px; font-weight: 800; letter-spacing: 0.18em; background: #fff; color: var(--teal); padding: 12px 20px; border-radius: 999px; border: 2px solid rgba(230,185,58,0.5); }
    .inner { position: relative; z-index: 2; height: 100%; padding: 120px 64px 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
    .panel { background: #fff; border-radius: 36px; padding: 64px 52px; max-width: 920px; box-shadow: 0 22px 60px rgba(10,58,68,0.13); border: 2px solid rgba(15,122,142,0.12); box-sizing: border-box; width: 100%; }
    .serie { font-size: 22px; font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase; color: var(--teal); margin-bottom: 20px; }
    .titre { font-size: 72px; font-weight: 800; line-height: 1.1; margin: 0; }
    .rule { width: 88px; height: 5px; background: var(--gold); border-radius: 3px; margin: 36px auto; }
    .gold { color: #9a7720; font-weight: 800; }
  </style>
</head>
<body>
  <div class="label">2/12 · Une règle 2/3</div>
  <div class="slide">
    <div class="atmo"></div><div class="atmo-teal"></div>
    <div class="ribbon">Sélection · série courte</div>
    <div class="badge">2 / 3</div>
    <div class="inner">
      <div class="panel">
        <p class="serie">Une règle</p>
        <h1 class="titre">Une vraie<br /><span class="gold">plus-value.</span></h1>
        <div class="rule"></div>
        <p style="font-size:36px;font-weight:600;color:var(--muted);margin:0">Service · cadre · expérience soignée.</p>
      </div>
    </div>
  </div>
</body>
</html>
