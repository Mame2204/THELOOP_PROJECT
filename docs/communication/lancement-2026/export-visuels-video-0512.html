<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 5/12 · anti-annuaire</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; --muted: #3d5560; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide { width: 1080px; height: 1920px; margin: 0 auto 16px; position: relative; overflow: hidden; background: linear-gradient(175deg, #ecf4f7 0%, #c8e3ec 40%, #96c4d4 100%); color: var(--deep); }
    .slide.dark { background: linear-gradient(165deg, #0f7a8e 0%, #0a3a44 55%, #062830 100%); color: #fff; }
    .inner { position: relative; z-index: 2; height: 100%; padding: 140px 64px 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
    .panel { background: #fff; border-radius: 36px; padding: 64px 48px; max-width: 920px; width: 100%; box-sizing: border-box; box-shadow: 0 24px 64px rgba(10,58,68,0.14); border: 2px solid rgba(15,122,142,0.12); }
    .slide.dark .panel { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); box-shadow: none; }
    .h { font-size: 56px; font-weight: 800; line-height: 1.12; margin: 0; }
    .gold { color: #9a7720; font-weight: 800; }
    .slide.dark .gold { color: var(--gold); }
    .pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .pillars span { font-size: 26px; font-weight: 800; padding: 24px 12px; border-radius: 18px; background: rgba(10,58,68,0.06); border: 2px solid rgba(230,185,58,0.45); }
    .blur-phone { width: 480px; height: 840px; border-radius: 40px; overflow: hidden; margin: 24px auto 0; border: 4px solid rgba(255,255,255,0.3); }
    .blur-phone img { width: 100%; height: 100%; object-fit: cover; filter: blur(20px); transform: scale(1.12); }
    .cta { font-size: 60px; font-weight: 800; margin: 0; }
  </style>
</head>
<body>
  <div class="label">5/12 · 1</div>
  <div class="slide">
    <div class="inner"><div class="panel"><h1 class="h">On ne promet pas<br />tout Conakry.</h1></div></div>
  </div>
  <div class="label">5/12 · 2</div>
  <div class="slide dark">
    <div class="inner"><div class="panel"><h1 class="h">On promet<br /><span class="gold">un repère.</span></h1><p style="font-size:32px;font-weight:700;margin-top:24px;opacity:0.9">Sélectif.</p></div></div>
  </div>
  <div class="label">5/12 · 3 · flou</div>
  <div class="slide">
    <div class="inner">
      <div class="panel">
        <div class="blur-phone"><img src="assets/capture-accueil-2.jpg" alt="" /></div>
        <div class="pillars"><span>Spots</span><span>Agenda</span><span>Parcours</span><span>Outils</span></div>
      </div>
    </div>
  </div>
  <div class="label">5/12 · 4 · CTA</div>
  <div class="slide dark">
    <div class="inner"><div class="panel"><p style="font-size:24px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;opacity:0.85">Accès anticipé</p><h1 class="cta gold">Réserve ta place</h1></div></div>
  </div>
</body>
</html>
