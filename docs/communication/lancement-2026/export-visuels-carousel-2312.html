<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 23/12 · carrousel teaser lancement</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; --muted: #3d5560; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide { width: 1080px; height: 1350px; margin: 0 auto 16px; position: relative; overflow: hidden; background: linear-gradient(175deg, #ecf4f7 0%, #c8e3ec 40%, #96c4d4 100%); color: var(--deep); }
    .slide.dark { background: linear-gradient(165deg, #1a2838 0%, #0a3a44 55%, #062830 100%); color: #fff; }
    .slide.gold { background: linear-gradient(165deg, #3d3018 0%, #0a3a44 50%, #062830 100%); color: #fff; }
    .atmo { position: absolute; inset: -20%; background: url('assets/capture-accueil-2.jpg') center 20% / cover no-repeat; filter: blur(40px); opacity: 0.24; }
    .atmo-teal { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(236,244,247,0.85) 100%); z-index: 1; }
    .ribbon { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 22px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; background: linear-gradient(90deg, var(--deep), var(--teal)); color: #fff; }
    .badge { position: absolute; top: 96px; left: 64px; z-index: 4; font-size: 18px; font-weight: 800; padding: 12px 20px; border-radius: 999px; background: #fff; color: var(--teal); border: 2px solid rgba(230,185,58,0.5); }
    .slide.dark .badge, .slide.gold .badge { background: rgba(255,255,255,0.12); color: var(--gold); }
    .inner { position: relative; z-index: 2; height: 100%; padding: 128px 64px 88px; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
    .panel { background: #fff; border-radius: 32px; padding: 56px 52px; box-shadow: 0 20px 56px rgba(10,58,68,0.14); border: 2px solid rgba(15,122,142,0.12); }
    .slide.dark .panel, .slide.gold .panel { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); box-shadow: none; }
    .h { font-size: 58px; font-weight: 800; line-height: 1.1; margin: 0 0 20px; }
    .p { font-size: 36px; font-weight: 600; line-height: 1.42; margin: 0; color: var(--muted); }
    .slide.dark .p, .slide.gold .p { color: rgba(255,255,255,0.9); }
    .gold { color: #9a7720; font-weight: 800; }
    .slide.dark .gold, .slide.gold .gold { color: var(--gold); }
    .quote { font-size: 38px; font-weight: 700; line-height: 1.35; font-style: italic; margin: 0; }
    .slide.dark .quote { font-style: normal; font-weight: 800; }
    .pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
    .pillars span { font-size: 26px; font-weight: 800; padding: 22px 12px; text-align: center; border-radius: 18px; background: rgba(10,58,68,0.06); border: 2px solid rgba(230,185,58,0.45); }
    .slide.dark .pillars span { background: rgba(255,255,255,0.08); color: #fff; }
    .rule { width: 80px; height: 5px; background: var(--gold); border-radius: 3px; margin: 28px 0; }
  </style>
</head>
<body>

  <div class="label">23/12 · 1/4</div>
  <div class="slide gold">
    <div class="ribbon">Teaser lancement</div>
    <div class="badge">1 / 4</div>
    <div class="inner">
      <div class="panel">
        <h1 class="h"><span class="gold">24 décembre</span></h1>
        <div class="rule"></div>
        <p class="p">The Loop s’ouvre.</p>
      </div>
    </div>
  </div>

  <div class="label">23/12 · 2/4</div>
  <div class="slide">
    <div class="atmo"></div><div class="atmo-teal"></div>
    <div class="ribbon">Dans le guide</div>
    <div class="badge">2 / 4</div>
    <div class="inner">
      <div class="panel">
        <div class="pillars"><span>Spots</span><span>Agenda</span><span>Parcours</span><span>Outils</span></div>
      </div>
    </div>
  </div>

  <div class="label">23/12 · 3/4</div>
  <div class="slide dark">
    <div class="badge">3 / 4</div>
    <div class="inner">
      <div class="panel">
        <p class="quote">Les bonnes adresses ne s'annoncent pas.<br /><span class="gold">Elles se transmettent.</span></p>
      </div>
    </div>
  </div>

  <div class="label">23/12 · 4/4</div>
  <div class="slide dark">
    <div class="badge">4 / 4</div>
    <div class="inner">
      <div class="panel">
        <h1 class="h"><span class="gold">theloop-app.com</span></h1>
        <p class="p" style="margin-top:24px">Demain · ouverture publique</p>
        <p class="p" style="font-size:28px;margin-top:20px;opacity:0.75">UTM · launch_teaser_2312</p>
      </div>
    </div>
  </div>

</body>
</html>
