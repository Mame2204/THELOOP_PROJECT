<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — 4/12 · J-13</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide {
      width: 1080px; height: 1350px; margin: 0 auto 16px; position: relative; overflow: hidden;
      background: linear-gradient(165deg, #0f7a8e 0%, #0a3a44 55%, #062830 100%); color: #fff;
    }
    .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 38%, rgba(230,185,58,0.2), transparent 60%); }
    .inner { position: relative; z-index: 2; height: 100%; padding: 88px 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
    .jx { font-size: 200px; font-weight: 800; line-height: 0.95; margin: 0; color: var(--gold); }
    .jx span { font-size: 100px; vertical-align: super; }
    .rule { width: 100px; height: 5px; background: var(--gold); border-radius: 3px; margin: 36px auto; }
    .h { font-size: 48px; font-weight: 800; line-height: 1.25; margin: 0; }
    .p { font-size: 34px; font-weight: 600; margin-top: 28px; color: rgba(255,255,255,0.88); max-width: 880px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="label">4/12 · J-13 · accès anticipé</div>
  <div class="slide">
    <div class="glow"></div>
    <div class="inner">
      <p style="font-size:24px;font-weight:800;letter-spacing:0.24em;text-transform:uppercase;opacity:0.85;margin:0 0 24px">Compte à rebours</p>
      <h1 class="jx">J<span>-</span>13</h1>
      <div class="rule"></div>
      <h2 class="h">Accès anticipé<br /><span style="color:var(--gold)">17 décembre</span></h2>
      <p class="p"><strong style="color:var(--gold)">100 premières places</strong> · liste ouverte · inscris-toi avant le grand public.</p>
    </div>
  </div>
</body>
</html>
