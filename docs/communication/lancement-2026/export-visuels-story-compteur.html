<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>The Loop — stories compteur de places (18/11 · 20/11)</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --deep: #0a3a44; --teal: #0f7a8e; --gold: #e6b93a; }
    body { margin: 0; font-family: Manrope, sans-serif; background: #ccc; padding: 20px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; margin: 28px 0 10px; }
    .slide {
      width: 1080px; height: 1920px; margin: 0 auto 16px; position: relative; overflow: hidden;
      background: linear-gradient(165deg, #0f7a8e 0%, #0a3a44 55%, #062830 100%); color: #fff;
    }
    .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 45% at 50% 44%, rgba(230,185,58,0.22), transparent 62%); }
    .top-ribbon {
      position: absolute; top: 0; left: 0; right: 0; padding: 26px; text-align: center;
      font-size: 22px; font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase;
      background: linear-gradient(90deg, #0a3a44, #0f7a8e);
    }
    .inner { position: relative; z-index: 2; height: 100%; padding: 320px 72px 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
    .ey { font-size: 34px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.82); margin: 0; }
    .num { font-size: 360px; font-weight: 800; line-height: 1; margin: 12px 0 0; color: var(--gold); letter-spacing: -0.02em; }
    .sub { font-size: 48px; font-weight: 800; margin: 8px 0 0; }
    .rule { width: 110px; height: 6px; background: var(--gold); border-radius: 3px; margin: 56px auto 48px; }
    .p { font-size: 40px; font-weight: 600; line-height: 1.4; color: rgba(255,255,255,0.9); margin: 0; max-width: 880px; }
    .h { font-size: 92px; font-weight: 800; line-height: 1.1; margin: 0; }
    .gold { color: var(--gold); }
    .pill {
      margin-top: 60px; padding: 24px 48px; border-radius: 999px;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(230,185,58,0.6);
      font-size: 34px; font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="slides"></div>

  <template id="tpl-reste">
    <div class="label"></div>
    <div class="slide">
      <div class="glow"></div>
      <div class="top-ribbon">Accès anticipé</div>
      <div class="inner">
        <p class="ey">Il reste</p>
        <p class="num"></p>
        <p class="sub">places sur 100</p>
        <div class="rule"></div>
        <p class="p">Premiers inscrits,<br /><span class="gold">premiers invités.</span></p>
        <span class="pill">Réserve ta place</span>
      </div>
    </div>
  </template>

  <template id="tpl-complet">
    <div class="label">Compteur · complet</div>
    <div class="slide">
      <div class="glow"></div>
      <div class="top-ribbon">Accès anticipé</div>
      <div class="inner">
        <p class="ey">Merci</p>
        <h1 class="h" style="margin-top:28px">Les <span class="gold">100</span> places<br />sont prises.</h1>
        <div class="rule"></div>
        <p class="p">La liste reste ouverte.<br />Inscris-toi : tu seras prévenu·e <span class="gold">en priorité</span>.</p>
        <span class="pill">Rejoins la liste</span>
      </div>
    </div>
  </template>

  <script>
    const root = document.getElementById('slides');
    const values = [90, 80, 70, 60, 50, 40, 30, 20, 10];
    for (const v of values) {
      const frag = document.getElementById('tpl-reste').content.cloneNode(true);
      frag.querySelector('.label').textContent = `Compteur · il reste ${v}`;
      frag.querySelector('.num').textContent = String(v);
      root.appendChild(frag);
    }
    root.appendChild(document.getElementById('tpl-complet').content.cloneNode(true));
  </script>
</body>
</html>
