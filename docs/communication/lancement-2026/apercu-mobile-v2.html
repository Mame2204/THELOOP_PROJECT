<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Loop — Aperçu Feed v2</title>
  <style>
    body { margin: 0; padding: 16px; background: #111; color: #ccc; font-family: system-ui, sans-serif; }
    h1 { color: #e6b93a; font-size: 1.1rem; }
    p { font-size: 0.85rem; line-height: 1.4; }
    img { width: 100%; border-radius: 10px; margin: 12px 0 24px; }
    .tag { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #0f7a8e; }
  </style>
</head>
<body>
  <h1>Pack Feed v2 — conversion</h1>
  <p>Photo + app · dégradés · hooks feed. Dossier <code>exports-png-v2/</code>.</p>
  <script>
    const files = [
      ['3/11 Feed', '01_3_11_Feed_hook_dilemma.png'],
      ['3/11 Reels', '02_3_11_Reels_9_16_m_me_hook_.png'],
      ['5/11 Citation', '03_5_11_Citation_sur_photo.png'],
      ['12/11 J-5', '04_12_11_J-5_urgence.png'],
      ['16/11 J-1', '05_16_11_J-1.png'],
      ['17/11 C1', '06_17_11_Carrousel_1_scroll-stop.png'],
      ['17/11 C2', '07_17_11_Carrousel_2_probl_me.png'],
      ['17/11 C3', '08_17_11_Carrousel_3_produit.png'],
      ['17/11 C4', '09_17_11_Carrousel_4_s_lectif.png'],
      ['17/11 C5', '10_17_11_Carrousel_5_CTA.png'],
      ['17/11 Reels cover', '11_17_11_Reels_cover_La_fr_quence_.png'],
      ['17/11 Reels fin', '12_17_11_Reels_fin_CTA.png'],
      ['6/11 WhatsApp', '13_6_11_Frame_WhatsApp_CapCut_.png'],
    ];
    const base = 'exports-png-v2/';
    files.forEach(([label, f]) => {
      const t = document.createElement('div');
      t.className = 'tag';
      t.textContent = label;
      document.body.appendChild(t);
      const img = document.createElement('img');
      img.src = base + f;
      img.alt = label;
      img.loading = 'lazy';
      document.body.appendChild(img);
    });
  </script>
</body>
</html>
