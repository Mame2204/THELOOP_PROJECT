# Applique les migrations SQL en attente sur le projet Supabase prod (db push).
name: Supabase migrations (db push)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lier le projet et pousser les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN absent — impossible d'appliquer les migrations."
            exit 1
          fi
          supabase link --project-ref eeyhtulpixvftvhppinz --yes
          supabase db push --yes
