# Applique templates invite (token_hash) + site_url Supabase après merge auth.
name: Sync Auth e-mail (Supabase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/auth-email-template-bodies.mjs'
      - 'scripts/configure-auth-invite-email.mjs'
      - 'server/static/auth-callback.html'
      - 'server/assets/auth-callback-storage-redirect.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Templates Auth (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN absent — skip templates (Render boot sync ou script manuel)."
            exit 0
          fi
          node scripts/configure-auth-invite-email.mjs

      - name: Storage auth-callback text/html
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY absent — skip Storage MIME fix."
            exit 0
          fi
          node scripts/fix-auth-storage-content-type.mjs
