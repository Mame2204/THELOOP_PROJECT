<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>THE LOOP — Compte</title>
  <style>
    :root { color-scheme: light; --bg:#f4fcfd; --text:#0a0a0a; --muted:#636e72; --gold:#c9a84c; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); text-align: center;
    }
    main { max-width: 400px; width: 100%; }
    .kicker { font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
    h1 { margin: 12px 0 0; font-size: 1.25rem; line-height: 1.3; }
    p { margin: 12px 0 0; font-size: .9rem; line-height: 1.5; color: var(--muted); }
    .hint { margin-top: 16px; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">THE LOOP</p>
    <h1 id="title">Chargement…</h1>
    <p id="message">Validation du lien…</p>
    <p class="hint" id="hint"></p>
  </main>
  <script>
    (function () {
      /** Page pont — mot de passe choisi dans le navigateur (sans app installée). */
      var AUTH_CALLBACK_BASE = 'https://api.theloop-app.com/auth/callback';
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var hint = document.getElementById('hint');

      var merged = new URLSearchParams();
      var search = window.location.search || '';
      if (search.indexOf('?') === 0) {
        new URLSearchParams(search.slice(1)).forEach(function (v, k) {
          merged.set(k, v);
        });
      }
      var hash = window.location.hash || '';
      if (hash.indexOf('#') === 0 && hash.length > 1) {
        new URLSearchParams(hash.slice(1)).forEach(function (v, k) {
          merged.set(k, v);
        });
      }
      var paramString = merged.toString();

      if (!paramString) {
        title.textContent = 'Lien incomplet';
        message.textContent = 'Ce lien ne fonctionne pas. Demandez un nouvel e-mail d\'invitation ou de réinitialisation.';
        hint.textContent = 'contact@theloop-app.com';
        return;
      }

      var params = new URLSearchParams(paramString);
      var error = params.get('error_description') || params.get('error');
      if (error) {
        title.textContent = 'Lien invalide';
        message.textContent = decodeURIComponent(String(error).replace(/\+/g, ' '));
        return;
      }

      title.textContent = 'Un instant…';
      message.textContent = 'Ouverture de la page sécurisée pour choisir votre mot de passe.';
      hint.textContent = 'Vous n\'avez pas besoin d\'installer l\'app pour cette étape.';

      var target = AUTH_CALLBACK_BASE + '?' + paramString;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
