<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>THE LOOP — Ouverture</title>
  <style>
    :root { color-scheme: light; --bg:#f4fcfd; --text:#0a0a0a; --muted:#636e72; --gold:#c9a84c; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); text-align: center;
    }
    main { max-width: 400px; }
    .kicker { font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
    h1 { margin: 12px 0 0; font-size: 1.2rem; }
    p { margin: 14px 0 0; font-size: .92rem; line-height: 1.5; color: var(--muted); }
    .btn {
      display: inline-block; margin-top: 24px; padding: 14px 22px; border-radius: 12px;
      background: #0a0a0a; color: #fff; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">THE LOOP</p>
    <h1 id="title">Ouverture de l'application…</h1>
    <p id="message">Vous allez choisir votre mot de passe dans l'app.</p>
    <a class="btn" id="openApp" href="theloop://auth/callback" style="display:none">Ouvrir THE LOOP</a>
  </main>
  <script>
    (function () {
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var openApp = document.getElementById('openApp');

      function readParams() {
        var hash = window.location.hash || '';
        var search = window.location.search || '';
        var paramString = hash.indexOf('#') === 0 ? hash.slice(1)
          : (search.indexOf('?') === 0 ? search.slice(1) : '');
        return { paramString: paramString, params: new URLSearchParams(paramString) };
      }

      function openTheLoopApp(queryString) {
        var deepLink = 'theloop://auth/callback?' + queryString;
        openApp.href = deepLink;
        try { window.location.replace(deepLink); } catch (e) { /* ignore */ }
        setTimeout(function () {
          title.textContent = 'Ouvrez THE LOOP';
          message.textContent = 'Le mot de passe se choisit dans l\'application. Si rien ne s\'ouvre, touchez le bouton.';
          openApp.style.display = 'inline-block';
        }, 1200);
      }

      var parsed = readParams();
      var params = parsed.params;
      var paramString = parsed.paramString;
      var kind = (params.get('type') || 'invite').toLowerCase();
      var tokenHash = params.get('token_hash');
      var accessToken = params.get('access_token');
      var refreshToken = params.get('refresh_token');

      var error = params.get('error_description') || params.get('error');
      if (error) {
        title.textContent = 'Lien invalide';
        message.textContent = decodeURIComponent(String(error).replace(/\+/g, ' '));
        return;
      }

      if (tokenHash) {
        var appParams = new URLSearchParams({
          token_hash: tokenHash,
          type: kind === 'recovery' ? 'recovery' : 'invite',
        });
        openTheLoopApp(appParams.toString());
        return;
      }

      if (paramString && accessToken && refreshToken) {
        openTheLoopApp(paramString);
        return;
      }

      title.textContent = 'Lien incomplet';
      message.textContent = 'Demandez un nouvel e-mail d\'invitation, puis ouvrez-le sur votre téléphone.';
    })();
  </script>
</body>
</html>
